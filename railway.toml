# Railway toma estos valores al conectar el repo; sin esto infiere con Nixpacks.

[build]
builder = "NIXPACKS"
buildCommand = "npm run build"

[deploy]
startCommand = "npm start"
healthcheckPath = "/api/health"
healthcheckTimeout = 60
# Si el proceso muere (por ejemplo, falta una variable), que reintente.
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
